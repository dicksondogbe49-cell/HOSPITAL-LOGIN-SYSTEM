services:
  - type: web
    name: hospital-management-system
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIRECTORY
        value: data
      - key: BACKUP_DIRECTORY
        value: backups
      - key: ALLOW_OTP_FALLBACK
        value: "true"
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: dicksondogbe49@gmail.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        value: dicksondogbe49@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: BACKUP_EMAIL
        value: dicksondogbe49@gmail.com
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PREFIX
        value: database-backups
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OTP_SHARED_EMAIL
        value: dicksondogbe49@gmail.com

